name: SERVER DEPLOY

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Github Repository 에서 파일 불러 오기
        uses: actions/checkout@v4

      - name: JDK 25버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Gradle 캐싱
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # hashFiles 경로에 프로젝트 폴더명 추가
          key: ${{ runner.os }}-gradle-${{ hashFiles('tradelink/**/*.gradle*', 'tradelink/**/*.gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: gradlew 실행 권한 부여
        # 실행 경로를 프로젝트 폴더 안으로 지정
        run: chmod +x ./gradlew
        working-directory: ./tradelink

      - name: 백엔드 jar 빌드
        run: ./gradlew build -x test
        working-directory: ./tradelink

      - name: 빌드된 JAR 파일 이름 변경
        # 빌드 결과물은 tradelink/build/libs 아래에 생성됩니다.
        run: mv ./tradelink/build/libs/*SNAPSHOT.jar ./server-tradelink.jar

      - name: EC2 서버로 JAR 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_EC2_HOST }}
          username: ${{ secrets.DEV_SERVER_EC2_USERNAME }}
          key: ${{ secrets.DEV_SERVER_EC2_PRIVATE_KEY }}
          # 위에서 루트로 꺼내온 jar 파일을 전송합니다.
          source: "server-tradelink.jar"
          target: "/home/ubuntu/server-tradelink/tobe"

      - name: SSH로 EC2에 접속 후 애플리케이션 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_EC2_HOST }}
          username: ${{ secrets.DEV_SERVER_EC2_USERNAME }}
          key: ${{ secrets.DEV_SERVER_EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            rm -rf /home/ubuntu/server-tradelink/current
            mkdir -p /home/ubuntu/server-tradelink/current
            mv /home/ubuntu/server-tradelink/tobe/server-tradelink.jar /home/ubuntu/server-tradelink/current/server-tradelink.jar
            cd /home/ubuntu/server-tradelink/current
            sudo fuser -k -n tcp 17771 || true    
            nohup java -Duser.timezone=Asia/Seoul -jar server-tradelink.jar > ./output.log 2>&1 &
            rm -rf /home/ubuntu/server-tradelink/tobe