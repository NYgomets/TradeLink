spring:
  config:
    import:
      - "aws-parameterstore:/tradelink/dev/"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-name: naver
            redirect-uri: ${BACKEND_URL}/login/oauth2/code/naver
            scope:
              - profile
              - email

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-name: kakao
            client-authentication-method: client_secret_post
            redirect-uri: ${BACKEND_URL}/login/oauth2/code/kakao
            scope:
              - profile_nickname
              - account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            issuer-uri: https://kauth.kakao.com
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 100
      open-in-view: false

  threads:
    virtual:
      enabled: true

bok:
  api:
    base-url: https://ecos.bok.or.kr/api
    auth-key: ${BOK_API_KEY}
    timeout: 10000

sse:
  timeout: 1800000
  queue-size: 100
  heartbeat-interval: 30000

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
      path:
        postPhoto: post-photo
      presign:
        upload-expire-seconds: 300
        download-expire-seconds: 300

management:
  metrics:
    enable:
      all: true
      jvm: true
      system: true
      process: true
  endpoints:
    web:
      exposure:
        include: health, httpexchanges, info, metrics, prometheus

server:
  port: 17771
  address: 0.0.0.0
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        http-only: true

scheduler:
  order:
    process-delay-ms: 500

stock:
  orderbook:
    stale-ttl-ms: 5000